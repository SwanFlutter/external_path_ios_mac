name: external_path_ios_mac
description: "A Flutter package for retrieving directory paths on iOS and macOS devices, ensuring file access and management across platforms."
version: 0.0.8
homepage: "https://github.com/SwanFlutter/external_path_ios_mac"

environment:
  sdk: ^3.12.2
  flutter: '>=3.3.0'

dependencies:
  flutter:
    sdk: flutter
  plugin_platform_interface: ^2.1.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0


flutter:

  plugin:
    platforms:
      ios:
        pluginClass: ExternalPathIosMacPlugin
      macos:
        pluginClass: ExternalPathIosMacPlugin
